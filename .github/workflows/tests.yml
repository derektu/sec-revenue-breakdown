name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝依賴
        run: pip install -r requirements.txt

      - name: Unit test
        run: python -m unittest discover -s tests -t .

      - name: 驗證 ticker 清單與對照資料
        run: python scripts/validate_universe.py
