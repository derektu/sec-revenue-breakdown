<!doctype html>
<html lang="zh-Hant">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width"
  /><title>SEC 營收證據</title>
  <style>
    body {
      font: 16px system-ui;
      background: #f5f6fa;
      color: #182332;
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 24px;
    }
    h1 {
      font-size: 30px;
    }
    input,
    select,
    button {
      padding: 10px;
      margin: 6px;
      border: 1px solid #abb8ca;
      border-radius: 6px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      background: white;
    }
    td,
    th {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    td.amount {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .bar {
      height: 14px;
      background: #287cc0;
    }
    .negative {
      background: #b94650;
    }
    pre {
      white-space: pre-wrap;
      font-size: 12px;
      max-height: 350px;
      overflow: auto;
    }
    #risk {
      background: #fff1d9;
      padding: 18px;
      margin: 20px 0;
    }
    #error {
      color: #a00;
    }
    small {
      color: #516276;
    }
    a {
      color: #176797;
    }
    tr.evidence > td {
      padding: 4px 12px 18px;
      background: #fbfcfe;
    }
    .ev-missing {
      background: #fde7e9;
      color: #a50e0e;
      border-left: 5px solid #a50e0e;
      padding: 8px 12px;
      font-weight: 700;
    }
    .ev-warn {
      background: #fff4d6;
      color: #7a4b00;
      border-left: 5px solid #c98a00;
      padding: 8px 12px;
      font-weight: 700;
    }
    .ev-expression {
      font-variant-numeric: tabular-nums;
      margin: 6px 0 10px;
    }
    .ev-badge {
      display: inline-block;
      min-width: 14px;
      padding: 0 4px;
      border-radius: 8px;
      background: #d93025;
      color: white;
      font: 700 12px/17px system-ui;
      text-align: center;
    }
    .ev-fact {
      margin: 10px 0 16px;
    }
    .ev-fact a {
      margin-right: 14px;
    }
    .ev-fact img {
      display: block;
      max-width: 100%;
      margin-top: 6px;
      border: 1px solid #ccd5e1;
    }
  </style>
  <h1>SEC 營收與解析證據</h1>
  <p>已見期間回溯 · parser 維護風險 · SEC 主要來源</p>
  <form id="form">
    <label
      >Ticker
      <input id="ticker" value="AAPL" list="tickers" maxlength="8" /></label
    ><datalist id="tickers"></datalist><button>載入</button
    ><label
      >期間
      <select id="period"></select></label
    ><label
      >口徑
      <select id="basis"></select
    ></label>
  </form>
  <p id="error" role="alert"></p>
  <p id="context"></p>
  <p id="reference"></p>
  <section id="risk"></section>
  <table>
    <thead>
      <tr>
        <th>分類</th>
        <th>美元</th>
        <th>數值方向／規模</th>
        <th>萃取運算元</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <p>
    <small
      >圖條顯示正負數與相對規模；總額、子項及證券收入組成不可重複相加。參考原值未上傳雲端。</small
    >
  </p>
  <script>
    let data = [];
    const el = (id) => document.getElementById(id);
    function options(node, values, selected) {
      node.replaceChildren(
        ...values.map((v) => {
          const x = document.createElement("option");
          x.value = v;
          x.textContent = v;
          return x;
        }),
      );
      if (values.includes(selected)) node.value = selected;
    }
    function render() {
      const matching = data.filter((r) => r.period_end === el("period").value);
      options(
        el("basis"),
        [...new Set(matching.map((r) => r.basis))],
        el("basis").value || matching[0]?.primary_basis,
      );
      const row = matching.find((r) => r.basis === el("basis").value);
      if (!row) return;
      el("context").textContent =
        `${row.ticker} · FY${row.fiscal_year ?? "未知"} Q${row.fiscal_quarter ?? "未知"} · ${row.fiscal_period?.startdate || "起日缺失"} → ${row.period_end} · ${row.basis} · ${row.source_formats.join(", ")}`;
      el("reference").textContent =
        "參考來源：" +
        (row.reference.reference_sources_by_period[row.period_end] || []).join(
          ", ",
        ) +
        "；雲端無參考原值，SEC 重播可獨立完成。";
      el("risk").textContent =
        `維護風險 ${row.risk.level} (${row.risk.score}/100)：${row.risk.reasons.join("；")}`;
      el("rows").replaceChildren();
      const max = Math.max(
        1,
        ...Object.values(row.outputs).map((o) => Math.abs(o.value_usd || 0)),
      );
      for (const [label, output] of Object.entries(row.outputs)) {
        const tr = document.createElement("tr");
        for (const text of [
          label,
          output.value_usd === null
            ? `缺值：${output.status}`
            : output.value_usd.toLocaleString("en-US"),
        ]) {
          const td = document.createElement("td");
          td.textContent = text;
          tr.append(td);
        }
        tr.children[1].className = "amount";
        const chart = document.createElement("td");
        const bar = document.createElement("div");
        bar.className = "bar" + (output.value_usd < 0 ? " negative" : "");
        bar.style.width = (Math.abs(output.value_usd || 0) / max) * 100 + "%";
        chart.append(bar);
        tr.append(chart);
        const evidence = document.createElement("td");
        const detail = document.createElement("details");
        const summary = document.createElement("summary");
        summary.textContent = `${output.SEC_operands.length} 個運算元（JSON）`;
        detail.append(summary);
        for (const fact of output.SEC_operands) {
          const link = document.createElement("a");
          if (/^https:\/\/www\.sec\.gov\/Archives\//.test(fact.source_url)) {
            link.href = fact.source_url;
            link.target = "_blank";
            link.rel = "noopener";
            link.textContent = "SEC 文件";
            detail.append(link);
          }
          const pre = document.createElement("pre");
          pre.textContent = JSON.stringify(fact, null, 2);
          detail.append(pre);
        }
        evidence.append(detail);
        tr.append(evidence);
        el("rows").append(tr, evidenceRow(row, label));
      }
    }
    const SCALE = { 3: " 千", 6: " 百萬", 9: " 十億" };
    const SEC_URL = /^https:\/\/www\.sec\.gov\//;
    function node(tag, className, text) {
      const x = document.createElement(tag);
      if (className) x.className = className;
      if (text !== undefined) x.textContent = text;
      return x;
    }
    function link(href, text) {
      const a = node("a", "", text);
      a.href = href;
      a.target = "_blank";
      a.rel = "noopener";
      return a;
    }
    function factLabel(fact) {
      const dates = fact.startdate
        ? `${fact.startdate}～${fact.enddate}`
        : fact.enddate;
      const sign = fact.value < 0 ? "−" : "";
      return `${fact.form} ${fact.duration}（${dates}）${sign}${fact.raw}${SCALE[fact.scale] || ""}`;
    }
    function usd(value) {
      return value === null || value === undefined ? "空值" : value.toLocaleString("en-US");
    }
    // 證據缺失、失敗或與萃取輸出不符時以紅色區塊標示「無證據」，不顯示成正常狀態。
    function evidenceRow(row, label) {
      const tr = node("tr", "evidence");
      const td = node("td");
      td.colSpan = 4;
      tr.append(td);
      const evidence = row.evidence;
      const field = evidence?.fields?.[label];
      if (!evidence) {
        td.append(node("div", "ev-missing", "無證據：這一期尚未產生 SEC 表格證據"));
        return tr;
      }
      if (evidence.error && !field) {
        td.append(node("div", "ev-missing", "無證據：" + evidence.error));
        return tr;
      }
      if (evidence.stale) {
        td.append(
          node(
            "div",
            "ev-missing",
            "無證據：證據已過期，需重新產生（" + evidence.stale_reasons.join("；") + "）",
          ),
        );
        return tr;
      }
      if (!field || field.status === "failed" || field.status === "no_operands") {
        td.append(
          node(
            "div",
            "ev-missing",
            "無證據：" + (field?.reasons.join("；") || "找不到這個欄位的證據"),
          ),
        );
        if (!field?.expressions.length) return tr;
      } else if (field.status === "not_in_table") {
        td.append(
          node("div", "ev-warn", "部分運算元無證據（不在 HTML 表格內）：" + field.reasons.join("；")),
        );
      }
      const empty = row.outputs[label].value_usd === null;
      const facts = [];
      field.expressions.forEach((expression, index) => {
        const line = node("div", "ev-expression");
        // 萃取值為空時不寫成「值 = 運算式」，避免看起來像有萃取結果。
        line.append(
          (empty ? "萃取值為空，替代式僅供參考：" : "") +
            (field.expressions.length > 1 ? `替代式 ${index + 1}：` : "") +
            (empty ? "" : `${usd(expression.value_usd)} = `),
        );
        expression.terms.forEach((term, i) => {
          const fact = evidence.facts[term.fact];
          const sign = term.weight < 0 ? " − " : i ? " + " : "";
          const weight = Math.abs(term.weight) === 1 ? "" : `${Math.abs(term.weight)} × `;
          line.append(sign + weight, node("span", "ev-badge", String(fact.number)), " " + factLabel(fact));
          if (!facts.includes(term.fact)) facts.push(term.fact);
        });
        td.append(line);
      });
      for (const key of facts) {
        const fact = evidence.facts[key];
        const box = node("div", "ev-fact");
        box.append(
          node("span", "ev-badge", String(fact.number)),
          ` ${fact.form} · 申報日 ${fact.filing_date} · accession ${fact.accession} · ${fact.fact_id} `,
        );
        const links = node("div");
        if (SEC_URL.test(fact.source_url || "")) links.append(link(fact.source_url, "SEC 原文"));
        if (/^https:\/\/www\.sec\.gov\/ix\?doc=/.test(fact.ixviewer_url || ""))
          links.append(link(fact.ixviewer_url, "XBRL viewer"));
        const table = fact.table && evidence.tables[fact.table];
        const base = `/evidence/${encodeURIComponent(row.ticker)}/${row.period_end}/`;
        if (table) links.append(link(base + table.html, "表格 HTML"));
        box.append(links);
        if (table) {
          if (table.cropped)
            box.append(node("div", "ev-warn", "截圖已裁切：只保留表頭與標示列附近，略過的列以 ✂ 標示"));
          const image = node("img");
          image.src = base + table.png;
          image.alt = `${fact.form} 表格 #${fact.table_index}`;
          image.loading = "lazy";
          box.append(link(base + table.png, ""));
          box.lastChild.append(image);
        } else {
          box.append(
            node(
              "div",
              fact.status === "not_in_table" ? "ev-warn" : "ev-missing",
              "無表格證據：" + fact.reason,
            ),
          );
        }
        td.append(box);
      }
      return tr;
    }
    async function load(event) {
      event?.preventDefault();
      el("error").textContent = "";
      try {
        const response = await fetch(
          "/api/revenue?ticker=" + encodeURIComponent(el("ticker").value),
        );
        if (!response.ok)
          throw new Error(
            response.status === 404 ? "尚無已重播資料" : "Ticker 或查詢無效",
          );
        data = await response.json();
        options(
          el("period"),
          [...new Set(data.map((r) => r.period_end))].sort().reverse(),
        );
        el("basis").replaceChildren();
        render();
      } catch (error) {
        el("error").textContent = error.message;
        el("rows").replaceChildren();
        el("context").textContent = "";
        el("risk").textContent = "";
        el("reference").textContent = "";
      }
    }
    el("form").addEventListener("submit", load);
    el("period").addEventListener("change", render);
    el("basis").addEventListener("change", render);
    fetch("/api/tickers")
      .then((r) => r.json())
      .then((values) => options(el("tickers"), values));
    load();
  </script>
</html>
