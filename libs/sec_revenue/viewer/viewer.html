<!doctype html>
<html lang="zh-Hant">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title>SEC 營收正式輸出</title>
  <style>
    body {
      font: 15px system-ui;
      background: #f5f6fa;
      color: #182332;
      margin: 24px auto;
      max-width: 1400px;
      padding: 0 20px;
    }
    h1 { font-size: 24px; margin: 0 0 4px; }
    h2 { font-size: 18px; margin: 20px 0 8px; }
    small, .muted { color: #516276; }
    a { color: #176797; }
    input, select, button {
      font: inherit;
      padding: 6px 10px;
      border: 1px solid #abb8ca;
      border-radius: 6px;
      background: white;
    }
    .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0; }
    .picker { position: relative; }
    .picker input { width: 320px; }
    .picker ul {
      position: absolute; z-index: 10; left: 0; top: 100%; margin: 2px 0 0; padding: 4px 0;
      width: 420px; max-height: 360px; overflow-y: auto; list-style: none;
      background: white; border: 1px solid #abb8ca; border-radius: 6px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    }
    .picker li { padding: 5px 12px; cursor: pointer; }
    .picker li[aria-selected="true"] { background: #176797; color: white; }
    .picker li .name { color: #516276; margin-left: 6px; }
    .picker li[aria-selected="true"] .name { color: #dbe9f5; }
    .picker li.none { color: #8a99ad; cursor: default; }
    .toggle button[aria-pressed="true"] { background: #176797; color: white; border-color: #176797; }
    #error { color: #a00; }
    .scroll { overflow-x: auto; background: white; border: 1px solid #d5dce6; }
    table.grid { border-collapse: collapse; font-variant-numeric: tabular-nums; }
    .grid th, .grid td { padding: 6px 10px; border-bottom: 1px solid #e3e8ef; white-space: nowrap; }
    .grid thead th { position: sticky; top: 0; background: #eef2f7; text-align: right; vertical-align: bottom; }
    .grid th.label { text-align: left; position: sticky; left: 0; background: white; z-index: 1; }
    .grid thead th.label { background: #eef2f7; z-index: 2; }
    .grid td { text-align: right; cursor: pointer; }
    .grid td:hover { outline: 2px solid #9cc3e0; outline-offset: -2px; }
    .grid tr.total th, .grid tr.total td { border-top: 2px solid #8a99ad; font-weight: 600; }
    .grid td.selected { outline: 2px solid #176797; outline-offset: -2px; background: #e8f2fa; }
    .grid td.empty { color: #8a99ad; }
    .grid td.blank { background: #f1f1f1; color: #6b5d00; font-style: italic; }
    .grid td.failed { background: #fde7e9; color: #a50e0e; }
    .grid td.diff { background: #fff1d6; box-shadow: inset 4px 0 #e08a00; }
    .flag { color: #c25e00; font-weight: 700; margin-left: 4px; }
    .unit { margin-left: 8px; font-weight: 400; font-size: 12px; color: #516276; }
    .colnote { display: block; font-weight: 400; font-size: 12px; color: #6b5d00; }
    .colnote.failed { color: #a50e0e; }
    .grid td.kept { font-style: normal; }
    .grid tr.reconciling th, .grid tr.reconciling td { font-style: italic; color: #3d4a5c; }
    .grid tr.reconciling.first th, .grid tr.reconciling.first td { border-top: 1px dashed #8a99ad; }
    .tag { font: 400 11px system-ui; font-style: normal; color: #516276; border: 1px solid #b8c3d1; border-radius: 3px; padding: 0 4px; margin-right: 6px; }
    #detail { background: white; border: 1px solid #d5dce6; padding: 14px 18px; margin-top: 16px; }
    .box { padding: 8px 12px; margin: 8px 0; border-left: 5px solid; }
    .box.warn { background: #fff4d6; border-color: #c98a00; color: #5c3b00; }
    .box.bad { background: #fde7e9; border-color: #a50e0e; color: #7a0b0b; }
    .box.info { background: #eef4fa; border-color: #5a8fbf; }
    .expr { font-variant-numeric: tabular-nums; margin: 6px 0; line-height: 1.9; }
    .badge {
      display: inline-block; min-width: 16px; padding: 0 5px; border-radius: 9px;
      background: #d93025; color: white; font: 700 12px/18px system-ui; text-align: center;
    }
    .table-ev { margin: 14px 0 22px; }
    .table-ev img { display: block; max-width: 100%; margin-top: 6px; border: 1px solid #ccd5e1; }
    .links a { margin-right: 14px; }
    dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 6px 0; }
    dl.kv dt { color: #516276; }
    dl.kv dd { margin: 0; }
    ul.plain { margin: 4px 0; padding-left: 20px; }
    .addends { margin: 4px 0 8px; }
    .addends table { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
    .addends td { padding: 1px 8px 1px 0; vertical-align: top; }
    .addends td.num { text-align: right; }
    nav a { margin-right: 14px; }
    nav a[aria-current="page"] { font-weight: 700; color: #182332; text-decoration: none; }
    .profile { background: white; border: 1px solid #d5dce6; padding: 10px 14px; margin: 8px 0 12px; }
    .profile .score { font-weight: 700; }
    .status-tag { font: 600 11px system-ui; border-radius: 3px; padding: 1px 5px; margin-left: 6px; border: 1px solid; }
    .status-tag.ok { color: #1d6b2f; border-color: #8cc79a; background: #eaf6ec; }
    .status-tag.wip { color: #7a5200; border-color: #e0bf73; background: #fff6df; }
    .status-tag.drop { color: #6b6b6b; border-color: #c4c4c4; background: #f1f1f1; }
    .picker li .status-tag { margin-left: 8px; }
    table.list { border-collapse: collapse; background: white; border: 1px solid #d5dce6; min-width: 960px; }
    .list th, .list td { padding: 9px 20px; border-bottom: 1px solid #e3e8ef; text-align: left; }
    .list thead th { background: #eef2f7; }
    .list th.center, .list td.center { text-align: center; }
    .list td.score { min-width: 90px; }
    .score-pill { display: inline-block; min-width: 44px; padding: 1px 8px; border-radius: 10px; font-variant-numeric: tabular-nums; }
    .score-pill.low { background: #fde7e9; color: #a50e0e; font-weight: 700; }
    .score-pill.mid { background: #fff1d6; color: #8a4b00; font-weight: 600; }
    .score-pill.none { color: #8a99ad; }
    #references details { background: white; border: 1px solid #d5dce6; margin: 8px 0; padding: 8px 14px; }
    #references summary { cursor: pointer; font-weight: 600; }
    .capture { margin: 12px 0 18px; }
    .capture img { display: block; max-width: 100%; margin-top: 6px; border: 1px solid #ccd5e1; }
  </style>
  <h1>SEC 營收正式輸出</h1>
  <nav><a href="#overview" id="nav-overview">總覽</a></nav>
  <p id="error" role="alert"></p>
  <section id="overview-page" hidden>
    <div class="bar">
      <label>狀態
        <select id="overview-status">
          <option value="">全部</option>
          <option value="ok">ok</option>
          <option value="wip">wip</option>
          <option value="drop">drop</option>
        </select>
      </label>
      <label>搜尋 <input id="overview-search" autocomplete="off" spellcheck="false" placeholder="代碼或名稱" /></label>
      <span class="muted" id="overview-count"></span>
    </div>
    <table class="list" id="overview"></table>
  </section>
  <section id="company-page" hidden>
    <div class="bar">
      <label class="picker">公司
        <input id="company" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="company-list"
          autocomplete="off" spellcheck="false" placeholder="輸入代碼或名稱" />
        <ul id="company-list" role="listbox" hidden></ul>
      </label>
      <span class="toggle" id="series">
        <button type="button" data-series="Q" aria-pressed="true">季度 Q</button>
        <button type="button" data-series="FY" aria-pressed="false">年度 FY</button>
      </span>
    </div>
    <div class="profile" id="profile"></div>
    <div id="notes"></div>
    <div class="scroll"><table class="grid" id="grid"></table></div>
    <p class="muted" id="legend">
      <span class="flag">△</span> 後來申報的比較欄與已上線值不同（差異標記）；灰底斜體：留空（未推算）；紅底：失敗。
      留空或失敗而保留先前上線輸出的期別，格子顯示已上線值。
    </p>
    <section id="detail" hidden></section>
    <section id="references"></section>
  </section>
  <script>
    const el = (id) => document.getElementById(id);
    const state = { companies: [], ticker: null, company: null, series: "Q", selected: null };
    const SOURCE = { stockanalysis: "Stock Analysis", futu: "富途", tradingview: "TradingView", manual: "手動輸入" };
    const HTTPS_URL = /^https:\/\//;
    const PICKER_LIMIT = 20;
    const ROLE = { quarter: "單季", annual: "年度", nine_months: "九個月", six_months: "六個月" };
    const STATUS = { published: "已上線", failed: "失敗", not_derived: "留空", unknown: "狀態不明" };
    const SEC_URL = /^https:\/\/www\.sec\.gov\//;
    const IX_URL = /^https:\/\/www\.sec\.gov\/ix\?doc=/;

    function node(tag, className, text) {
      const x = document.createElement(tag);
      if (className) x.className = className;
      if (text !== undefined && text !== null) x.textContent = text;
      return x;
    }
    function link(href, text) {
      const a = node("a", "", text);
      a.href = href;
      a.target = "_blank";
      a.rel = "noopener";
      return a;
    }
    function millions(value) {
      if (value === null || value === undefined) return "—";
      const m = value / 1e6;
      const digits = Number.isInteger(m) ? 0 : 3;
      return m.toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits });
    }
    function periodLabel(p, series) {
      if (series === "FY" || !p.fiscal_quarter) return `FY${p.fiscal_year ?? "?"}`;
      return `FY${p.fiscal_year ?? "?"} Q${p.fiscal_quarter}`;
    }
    const RESULT = { different: "數值不同", unparseable: "無法解析" };
    function amount(value) {
      return typeof value === "number" ? `${millions(value)} 百萬（${value.toLocaleString("en-US")}）` : value ?? "—";
    }
    function span(period) {
      return period?.start ? `${period.start}～${period.end}` : period?.end ?? "";
    }
    // 差異標記一方的加數：每列是一個 XBRL fact（運算元編號或 fact id、concept 與維度、權重、值）。
    function addendTable(title, addends, id) {
      const wrap = node("div", "addends");
      wrap.append(node("div", "", title));
      if (!Array.isArray(addends) || !addends.length) {
        wrap.append(node("div", "muted", "（無）"));
        return wrap;
      }
      const table = node("table");
      for (const a of addends) {
        const row = table.insertRow();
        const dims = Object.entries(a.dimensions || {}).map(([axis, member]) => `${axis}=${member}`).join("，");
        row.append(
          node("td", "", id(a) ?? ""),
          node("td", "", a.concept + (dims ? ` [${dims}]` : "")),
          node("td", "num", a.weight < 0 ? "−" : "+"),
          node("td", "num", typeof a.value === "number" ? millions(a.value) : a.value ?? "—"),
        );
      }
      wrap.append(table);
      return wrap;
    }
    // 依 FORMER_NAMES 以改名後的分類比對時，標記另記申報中的名稱。
    function withListed(item) {
      return item.listed_category ? `${item.category}（申報稱 ${item.listed_category}）` : item.category;
    }

    function differences(p) {
      const list = p.record?.differences;
      return Array.isArray(list) ? list : [];
    }
    // 表格的列：`kind` 是 category（分類）、reconciling（調節項）或 total（總營收）。
    const TOTAL_ROW = { kind: "total", name: "總營收" };
    function entryOf(p, row) {
      if (row.kind === "total") return p.revenue?.total;
      return (row.kind === "reconciling" ? p.revenue?.reconciling : p.revenue?.categories)?.[row.name];
    }
    function sameRow(a, b) {
      return a.kind === b.kind && a.name === b.name;
    }
    // 差異標記依 `category` 掛到同名的分類或調節項列；沒有分類（或分類為總營收）的歸在總營收列。
    function cellDiffs(p, row) {
      const isTotal = (d) => !d.category || d.category === "總營收" || d.category === "total";
      return differences(p).filter((d) => (row.kind === "total" ? isTotal(d) : !isTotal(d) && d.category === row.name));
    }

    async function loadCompanies() {
      const response = await fetch("/api/companies");
      const data = await response.json();
      state.companies = data.companies;
      state.universeErrors = data.universe_errors || [];
      await route();
    }

    // 網址 hash 決定頁面：有 `ticker` 是公司頁（`#ticker=KO&series=Q`），其他是總覽頁。
    async function route() {
      const hash = new URLSearchParams(location.hash.slice(1));
      const ticker = hash.get("ticker");
      const series = hash.get("series");
      if (series === "FY" || series === "Q") state.series = series;
      const wanted = ticker && state.companies.find((c) => c.ticker === ticker);
      el("overview-page").hidden = Boolean(wanted);
      el("company-page").hidden = !wanted;
      if (wanted) el("nav-overview").removeAttribute("aria-current");
      else el("nav-overview").setAttribute("aria-current", "page");
      if (wanted) {
        if (wanted.ticker !== state.ticker || !state.company) await chooseCompany(wanted.ticker);
        else if (state.company) render();
      } else {
        el("error").textContent = ticker
          ? `找不到 ${ticker}`
          : state.universeErrors.length
            ? "tickers.csv 驗證不通過，總覽只列有輸出的公司：" + state.universeErrors.join("；")
            : "";
        renderOverview();
      }
    }
    window.addEventListener("hashchange", () => route().catch((error) => (el("error").textContent = "載入失敗：" + error.message)));

    function statusTag(status) {
      return status ? node("span", "status-tag " + status, status) : node("span", "muted", "未列入");
    }
    // 評分 1–2 紅色、3 橘色提醒；4–5 不加色；空白為灰色「尚未評分」。
    function scoreLevel(score) {
      if (score === null || score === undefined) return "none";
      return score <= 2 ? "low" : score === 3 ? "mid" : "";
    }
    function scoreText(c) {
      return c.stability_score === null || c.stability_score === undefined ? "尚未評分" : `${c.stability_score} / 5`;
    }

    // 總覽頁：tickers.csv 的全部公司，可依狀態過濾、依代碼或名稱搜尋；有輸出的連到公司頁。
    function renderOverview() {
      const status = el("overview-status").value;
      const q = el("overview-search").value.trim().toLowerCase();
      const rows = state.companies
        .filter((c) => c.universe_status || state.universeErrors.length)
        .filter((c) => !status || c.universe_status === status)
        .filter((c) => !q || c.ticker.toLowerCase().includes(q) || (c.name || "").toLowerCase().includes(q));
      const universe = state.companies.filter((c) => c.universe_status || state.universeErrors.length).length;
      el("overview-count").textContent = `${rows.length} / ${universe} 家`;
      const table = el("overview");
      table.replaceChildren();
      const head = table.createTHead().insertRow();
      for (const label of ["代碼", "公司名稱", "狀態", "採用來源", "穩定度", "正式輸出"])
        head.append(node("th", label === "穩定度" ? "center" : "", label));
      const body = table.createTBody();
      for (const c of rows) {
        const row = body.insertRow();
        const ticker = node("td");
        if (c.has_output) {
          const a = node("a", "", c.ticker);
          a.href = `#ticker=${encodeURIComponent(c.ticker)}&series=Q`;
          ticker.append(a);
        } else ticker.textContent = c.ticker;
        const status = node("td");
        status.append(statusTag(c.universe_status));
        const score = node("td", "center score");
        score.append(node("span", "score-pill " + scoreLevel(c.stability_score), scoreText(c)));
        if (c.stability_note) score.title = c.stability_note;
        row.append(
          ticker,
          node("td", "", c.name || ""),
          status,
          node("td", "", SOURCE[c.adopted_source] ?? c.adopted_source ?? "—"),
          score,
          node("td", c.has_output ? "" : "muted", c.has_output ? "有" : "尚無輸出"),
        );
      }
      if (!rows.length) body.insertRow().append(node("td", "muted", "沒有符合的公司"));
    }
    el("overview-status").addEventListener("change", renderOverview);
    el("overview-search").addEventListener("input", renderOverview);

    // 公司搜尋：邊打邊找，輸入至少一個字才列候選，最多列 PICKER_LIMIT 筆；其他公司從總覽頁或 URL hash 開啟。
    // 候選是 status=ok 的公司與有輸出的 wip 公司；代碼與名稱都比對、不分大小寫；
    // 代碼完全相符、開頭相符、包含、名稱包含依序排列，同一級中 ok 在 wip 前。
    const picker = { matches: [], more: 0, active: -1 };
    function searchable(c) {
      return c.listed || (c.universe_status === "wip" && c.has_output);
    }
    function matchCompanies(query) {
      const q = query.trim().toLowerCase();
      if (!q) return [];
      const rank = (c) => {
        const t = c.ticker.toLowerCase();
        if (t === q) return 0;
        if (t.startsWith(q)) return 1;
        if (t.includes(q)) return 2;
        if ((c.name || "").toLowerCase().includes(q)) return 3;
        return -1;
      };
      return state.companies
        .filter(searchable)
        .map((c) => [rank(c), c])
        .filter(([r]) => r >= 0)
        .sort((a, b) => a[0] - b[0] || Number(!a[1].listed) - Number(!b[1].listed) || a[1].ticker.localeCompare(b[1].ticker))
        .map(([, c]) => c);
    }
    function renderPicker() {
      const list = el("company-list");
      list.replaceChildren();
      const query = el("company").value.trim();
      const all = matchCompanies(query);
      picker.matches = all.slice(0, PICKER_LIMIT);
      picker.more = all.length - picker.matches.length;
      if (picker.active >= picker.matches.length) picker.active = picker.matches.length - 1;
      if (!query) list.append(node("li", "none", "輸入代碼或名稱搜尋"));
      else if (!picker.matches.length) list.append(node("li", "none", "沒有符合的公司"));
      picker.matches.forEach((c, i) => {
        const li = node("li", "", c.ticker);
        li.id = "company-option-" + i;
        li.setAttribute("role", "option");
        li.setAttribute("aria-selected", String(i === picker.active));
        li.append(node("span", "name", c.name || ""));
        if (!c.listed) li.append(statusTag(c.universe_status));
        li.addEventListener("mousedown", (event) => {
          event.preventDefault();
          openCompany(c.ticker);
        });
        list.append(li);
      });
      if (picker.more > 0) list.append(node("li", "none", `還有 ${picker.more} 家，請輸入更多字`));
      const input = el("company");
      if (picker.active >= 0) {
        input.setAttribute("aria-activedescendant", "company-option-" + picker.active);
        document.getElementById("company-option-" + picker.active)?.scrollIntoView({ block: "nearest" });
      } else input.removeAttribute("aria-activedescendant");
    }
    function openPicker() {
      el("company-list").hidden = false;
      el("company").setAttribute("aria-expanded", "true");
      renderPicker();
    }
    function closePicker() {
      el("company-list").hidden = true;
      el("company").setAttribute("aria-expanded", "false");
      picker.active = -1;
      const current = state.companies.find((c) => c.ticker === state.ticker);
      el("company").value = current ? `${current.ticker} ${current.name}` : "";
    }
    // 從搜尋框選公司：改網址 hash（留下瀏覽紀錄），由 route() 載入。
    function openCompany(ticker) {
      closePicker();
      el("company").blur();
      location.hash = `ticker=${encodeURIComponent(ticker)}&series=${state.series}`;
    }
    async function chooseCompany(ticker) {
      state.ticker = ticker;
      closePicker();
      el("company").blur();
      await loadCompany();
    }
    el("company").addEventListener("focus", () => {
      picker.active = -1;
      el("company").value = "";
      openPicker();
    });
    el("company").addEventListener("input", () => {
      picker.active = el("company").value.trim() ? 0 : -1;
      openPicker();
    });
    el("company").addEventListener("blur", closePicker);
    el("company").addEventListener("keydown", (event) => {
      const n = picker.matches.length;
      if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        event.preventDefault();
        if (el("company-list").hidden) openPicker();
        if (!n) return;
        const step = event.key === "ArrowDown" ? 1 : -1;
        picker.active = picker.active < 0 ? (step > 0 ? 0 : n - 1) : (picker.active + step + n) % n;
        renderPicker();
      } else if (event.key === "Enter") {
        event.preventDefault();
        const choice = picker.matches[picker.active >= 0 ? picker.active : 0];
        if (choice) openCompany(choice.ticker);
      } else if (event.key === "Escape") {
        el("company").blur();
      }
    });

    // 公司頁頂端：狀態、採用來源、穩定度評分與理由（照 tickers.csv；空白評分顯示尚未評分）。
    function renderProfile(c) {
      const box = el("profile");
      box.replaceChildren();
      const title = node("div");
      title.append(node("strong", "", `${c.ticker} ${c.name || ""}`), statusTag(c.universe_status));
      box.append(title);
      const dl = node("dl", "kv");
      dl.append(node("dt", "", "採用來源"), node("dd", "", SOURCE[c.adopted_source] ?? c.adopted_source ?? "尚未決定"));
      dl.append(node("dt", "", "穩定度"), node("dd", "score", scoreText(c)));
      if (c.stability_note) dl.append(node("dt", "", "評分理由"), node("dd", "", c.stability_note));
      box.append(dl);
    }

    // 對照資料：每個來源一個可展開的區塊，列出每次擷取的頁面連結、擷取時間、數值指向它的期間與表格截圖。
    // 截圖在展開時才載入。
    async function loadReferences(ticker) {
      const box = el("references");
      box.replaceChildren();
      const response = await fetch("/api/references?ticker=" + encodeURIComponent(ticker));
      if (!response.ok || ticker !== state.ticker) return;
      const data = await response.json();
      box.append(node("h2", "", "對照資料"));
      if (data.errors?.length) {
        const bad = node("div", "box bad", "對照檔驗證不通過，不顯示擷取紀錄：");
        const ul = node("ul", "plain");
        for (const e of data.errors) ul.append(node("li", "", e));
        bad.append(ul);
        box.append(bad);
        return;
      }
      if (!data.sources.length) {
        box.append(node("div", "muted", "沒有對照資料。"));
        return;
      }
      const company = state.companies.find((c) => c.ticker === ticker) || {};
      for (const source of data.sources) {
        const details = node("details");
        const summary = node("summary", "", `${SOURCE[source.source] ?? source.source} · ${source.captures.length} 次擷取`);
        if (source.source === company.adopted_source) summary.append(node("span", "status-tag ok", "採用"));
        details.append(summary);
        for (const c of source.captures) {
          const item = node("div", "capture");
          const when = c.captured_at.replace("T", " ").replace(/\.\d+Z$|Z$/, " UTC");
          const line = node("div", "", `擷取時間 ${when} · 期間 ${c.periods.join("、") || "（無）"}`);
          if (HTTPS_URL.test(c.url || "")) line.append(" · ", link(c.url, "擷取頁面"));
          item.append(line);
          if (c.png) {
            const image = node("img");
            image.dataset.src = `/reference-capture/${encodeURIComponent(ticker)}/${source.source}/${c.capture}/table.png`;
            image.alt = `${SOURCE[source.source] ?? source.source} ${c.capture} 表格截圖`;
            const a = link(image.dataset.src, "");
            a.append(image);
            item.append(a);
          } else item.append(node("div", "muted", "手動輸入，沒有截圖"));
          details.append(item);
        }
        details.addEventListener("toggle", () => {
          if (details.open) for (const img of details.querySelectorAll("img[data-src]")) if (!img.src) img.src = img.dataset.src;
        });
        box.append(details);
      }
    }

    async function loadCompany() {
      el("error").textContent = "";
      state.selected = null;
      el("detail").hidden = true;
      const ticker = state.ticker;
      if (!ticker) return;
      const info = state.companies.find((c) => c.ticker === ticker);
      if (info) renderProfile(info);
      loadReferences(ticker).catch(() => {});
      const response = await fetch("/api/company?ticker=" + encodeURIComponent(ticker));
      if (!response.ok) {
        state.company = null;
        el("grid").replaceChildren();
        el("notes").replaceChildren();
        el("error").textContent = response.status === 404 ? `${ticker} 沒有正式輸出` : "查詢無效";
        return;
      }
      state.company = await response.json();
      const notes = el("notes");
      notes.replaceChildren();
      const errors = state.company.comparison_errors || [];
      if (errors.length) {
        const box = node("div", "box warn", `${errors.length} 份申報讀不到原文，沒有做比較欄比對：`);
        const ul = node("ul", "plain");
        for (const e of errors) ul.append(node("li", "", `${e.accession}：` + [e.check, e.reason].filter(Boolean).join("：")));
        box.append(ul);
        notes.append(box);
      }
      render();
    }

    function setSeries(series) {
      state.series = series;
      state.selected = null;
      el("detail").hidden = true;
      render();
    }

    function render() {
      const company = state.company;
      if (!company) return;
      for (const b of el("series").querySelectorAll("button"))
        b.setAttribute("aria-pressed", String(b.dataset.series === state.series));
      history.replaceState(null, "", `#ticker=${encodeURIComponent(company.ticker)}&series=${state.series}`);
      const periods = company.series[state.series] || [];
      const grid = el("grid");
      grid.replaceChildren();
      if (!periods.length) {
        const row = grid.insertRow();
        row.append(node("td", "empty", state.series === "FY" ? "這家公司還沒有 FY 序列的輸出" : "這家公司還沒有 Q 序列的輸出"));
        return;
      }
      // 列：各期分類的聯集，依最新一期的順序，舊期才有的分類接在後面。
      // 調節項（`reconciling`）同樣取聯集，列在分類之後、總營收之前。
      const rows = [];
      for (const kind of ["category", "reconciling"])
        for (const p of [...periods].reverse())
          for (const name of Object.keys((kind === "category" ? p.revenue?.categories : p.revenue?.reconciling) || {}))
            if (!rows.some((r) => sameRow(r, { kind, name }))) rows.push({ kind, name });
      const kept = (p) => p.status !== "published" && p.record?.published_output_kept && p.revenue;
      const head = grid.createTHead().insertRow();
      const corner = node("th", "label", "分類");
      corner.append(node("span", "unit", "百萬美元"));
      head.append(corner);
      for (const p of periods) {
        const th = node("th", "", periodLabel(p, state.series));
        th.append(node("span", "colnote", p.period_end));
        if (p.status !== "published")
          th.append(node("span", "colnote" + (p.status === "failed" ? " failed" : ""), (STATUS[p.status] ?? p.status) + (kept(p) ? "（保留已上線值）" : "")));
        if (p.record?.differs_from_published) th.append(node("span", "colnote", "重算不同"));
        head.append(th);
      }
      const body = grid.createTBody();
      let firstReconciling = true;
      for (const item of [...rows, TOTAL_ROW]) {
        const row = body.insertRow();
        const label = node("th", "label");
        if (item.kind === "total") row.className = "total";
        if (item.kind === "reconciling") {
          row.className = "reconciling" + (firstReconciling ? " first" : "");
          firstReconciling = false;
          label.append(node("span", "tag", "調節"));
        }
        label.append(item.name);
        row.append(label);
        for (const p of periods) {
          const td = row.insertCell();
          const entry = entryOf(p, item);
          if (p.status === "not_derived" || p.status === "failed") {
            td.className = p.status === "failed" ? "failed" : "blank";
            td.textContent = kept(p) ? (entry ? millions(entry.value) : "") : STATUS[p.status];
            if (kept(p)) td.classList.add("kept");
            td.title = [p.record?.check, p.record?.reason].filter(Boolean).join("：");
          } else if (!entry) {
            td.className = "empty";
            td.textContent = p.revenue ? "" : "無法讀取";
          } else {
            td.textContent = millions(entry.value);
          }
          const diffs = cellDiffs(p, item);
          if (diffs.length) {
            td.classList.add("diff");
            td.append(node("span", "flag", "△"));
            td.title = `差異標記 ${diffs.length} 筆`;
          }
          td.addEventListener("click", () => select(td, p, item));
          if (state.selected && state.selected.period === p.period_end && sameRow(state.selected.row, item)) td.classList.add("selected");
        }
      }
    }

    function select(td, p, row) {
      for (const x of el("grid").querySelectorAll("td.selected")) x.classList.remove("selected");
      td.classList.add("selected");
      state.selected = { period: p.period_end, row };
      showDetail(p, row);
    }

    function factLine(n, operand) {
      const dates = operand.period?.start ? `${operand.period.start}～${operand.period.end}` : operand.period?.end;
      const scale = { 3: " 千", 6: " 百萬", 9: " 十億" }[operand.scale] || "";
      return `${operand.form} ${ROLE[operand.role] ?? operand.role}（${dates}）${operand.value < 0 ? "−" : ""}${operand.raw}${scale}`;
    }

    function showDetail(p, row) {
      const company = state.company;
      const box = el("detail");
      box.hidden = false;
      box.replaceChildren();
      const revenue = p.revenue;
      const entry = entryOf(p, row);
      const label = row.kind === "reconciling" ? `調節項 ${row.name}` : row.name;
      box.append(node("h2", "", `${company.ticker} · ${label} · ${periodLabel(p, state.series)}（期末 ${p.period_end}）`));
      const status = node("div", "muted", `狀態：${STATUS[p.status] ?? p.status}` + (p.record?.accession ? ` · 主申報 ${p.record.accession}` : ""));
      box.append(status);
      const record = p.record || {};
      if (p.status === "not_derived" || p.status === "failed") {
        const why = node("div", p.status === "failed" ? "box bad" : "box warn");
        why.append(node("strong", "", `${STATUS[p.status]}：` + [record.check, record.reason].filter(Boolean).join("：")));
        if (record.fy_categories) {
          const dl = node("dl", "kv");
          dl.append(node("dt", "", "年度分類"), node("dd", "", record.fy_categories.join("、")));
          for (const q of record.quarter_categories || [])
            dl.append(node("dt", "", span(q)), node("dd", "", q.categories.join("、")));
          why.append(dl);
        }
        if (record.basis_changes) {
          const dl = node("dl", "kv");
          for (const c of record.basis_changes)
            dl.append(
              node("dt", "", `${withListed(c)}（${span(c.period)}）`),
              node("dd", "", `先前 ${amount(c.previous_value)}（${c.previous.basis === "published" ? "已上線 FY" : "上一份年報"} ${c.previous.accession}）→ 年報 ${amount(c.listed_value)}（${c.listed.accession}）`),
            );
          why.append(dl);
        }
        why.append(
          node("div", "", record.published_output_kept ? `保留先前上線的輸出（${record.published_output?.accession ?? ""}），以下是它的內容。` : "沒有先前上線的輸出。"),
        );
        box.append(why);
      }
      if (record.q4_basis) box.append(node("div", "box warn", `無法判斷 Q4 口徑，照常推算：${record.q4_basis.reason}`));
      const changed = record.differs_from_published;
      if (changed) {
        const warn = node("div", "box warn");
        warn.append(node("strong", "", `重算結果與已上線輸出不同：${changed.reason}。已上線數字不改，待人確認後覆寫。`));
        const dl = node("dl", "kv");
        for (const c of changed.categories || [])
          dl.append(node("dt", "", c.category), node("dd", "", `已上線 ${amount(c.published)} → 重算 ${amount(c.new)}`));
        if (changed.fields?.length) dl.append(node("dt", "", "不同的欄位"), node("dd", "", changed.fields.join("、")));
        warn.append(dl);
        box.append(warn);
      }
      if (record.stale_fields?.length)
        box.append(node("div", "box info", "重算結果只有中繼資料不同：" + record.stale_fields.join("、")));
      const diffs = cellDiffs(p, row);
      if (diffs.length) {
        const warn = node("div", "box warn");
        warn.append(node("strong", "", `差異標記 ${diffs.length} 筆：後來申報的比較欄與已上線值不同。已上線數字不改。`));
        for (const d of diffs) {
          const dl = node("dl", "kv");
          const source = d.source || {};
          const rows = [
            ["分類", withListed(d)],
            ["期間", `${ROLE[d.role] ?? d.role ?? ""}（${span(d.period)}）`],
            ["結果", RESULT[d.result] ?? d.result],
            ["已上線值", amount(d.published_value)],
            ["申報列示值", amount(d.listed_value)],
            ["來源申報", `${source.form ?? ""} ${source.accession ?? ""}，申報日 ${source.filing_date ?? ""}`],
            ["說明", d.note],
          ];
          for (const [label, value] of rows)
            if (value !== undefined && value !== null) dl.append(node("dt", "", label), node("dd", "", String(value)));
          warn.append(dl);
          warn.append(addendTable("已上線的加數", d.published_addends, (a) => a.operand));
          warn.append(addendTable("申報中的加數", d.listed_addends, (a) => a.fact_id));
        }
        box.append(warn);
      }
      if (!revenue) {
        if (p.status === "published") box.append(node("div", "box bad", "revenue.json 無法讀取"));
        return;
      }
      if (!entry) {
        box.append(node("div", "muted", "這一期沒有這個分類。"));
        return;
      }
      // 運算式：值 = ① … − ② …
      const operands = revenue.operands || {};
      const expr = node("div", "expr");
      expr.append(node("strong", "", `${millions(entry.value)} 百萬`), " = ");
      const used = [];
      entry.expression.forEach((term, i) => {
        const operand = operands[term.operand];
        const n = term.operand.replace(/^op/, "");
        const sign = term.weight < 0 ? (i ? " − " : "−") : i ? " + " : "";
        const weight = Math.abs(term.weight) === 1 ? "" : `${Math.abs(term.weight)} × `;
        expr.append(sign + weight, node("span", "badge", n), " " + (operand ? factLine(n, operand) : term.operand));
        if (operand) used.push([n, operand]);
      });
      box.append(expr);
      const filings = revenue.filings || {};
      const fl = node("ul", "plain muted");
      const order = (role) => (role === "primary" ? 0 : 1);
      for (const [role, f] of Object.entries(filings).sort((a, b) => order(a[0]) - order(b[0])))
        fl.append(node("li", "", `${role === "primary" ? "主申報" : role === "nine_months" ? "九個月申報" : role}：${f.form} ${f.accession}，申報日 ${f.filing_date}，期末 ${f.report_date}`));
      box.append(fl);
      const checks = revenue.checks || {};
      const structural = checks.structural || [];
      const failed = structural.filter((c) => c.result !== "pass");
      const sum = checks.sum;
      box.append(
        node(
          "div",
          failed.length ? "box bad" : "box info",
          `結構檢核：${failed.length ? "不通過 " + failed.map((c) => c.check).join("、") : `${structural.length} 項通過`}` +
            (sum ? ` · 加總：分類合計 ${millions(sum.categories)}，總營收 ${millions(sum.total)}，差額 ${millions(sum.difference)}（容許 ${millions(Number(sum.tolerance))}）` : ""),
        ),
      );
      // 證據：依表格分組，同一張表只顯示一次，列出表內的運算元編號。
      const tables = new Map();
      const loose = [];
      for (const [n, operand] of used) {
        const key = operand.evidence?.table;
        if (!key) { loose.push([n, operand]); continue; }
        if (!tables.has(key)) tables.set(key, []);
        tables.get(key).push([n, operand]);
      }
      const files = revenue.evidence_files || {};
      const base = `/revenue-evidence/${encodeURIComponent(company.ticker)}/${state.series}/${encodeURIComponent(p.period_end)}/`;
      for (const [key, members] of tables) {
        const section = node("div", "table-ev");
        const title = node("div");
        for (const [n] of members) title.append(node("span", "badge", n), " ");
        const first = members[0][1];
        title.append(`${first.form} · ${first.accession} · 申報日 ${first.filing_date} · ${first.document?.name ?? ""} · ` + members.map(([n, o]) => `${n}: ${o.fact_id}`).join("、"));
        section.append(title);
        const links = node("div", "links");
        if (SEC_URL.test(first.document?.url || "")) links.append(link(first.document.url, "SEC 原文"));
        if (IX_URL.test(first.document?.ixviewer_url || "")) links.append(link(first.document.ixviewer_url, "XBRL viewer"));
        const file = files[key];
        if (file && !file.problems.length) links.append(link(base + file.html, "表格 HTML"));
        section.append(links);
        if (!file || file.problems.length) {
          section.append(node("div", "box bad", "無表格證據：" + (file ? file.problems.join("；") : "找不到表格檔")));
        } else {
          const image = node("img");
          image.src = base + file.png;
          image.alt = `${first.form} 表格 ${key}`;
          image.loading = "lazy";
          const a = link(base + file.png, "");
          a.append(image);
          section.append(a);
        }
        box.append(section);
      }
      for (const [n, operand] of loose) {
        const section = node("div", "table-ev");
        section.append(node("span", "badge", n), ` ${operand.form} · ${operand.accession} · ${operand.fact_id}`);
        section.append(node("div", "box warn", "這個運算元沒有表格證據"));
        box.append(section);
      }
    }

    for (const b of el("series").querySelectorAll("button")) b.addEventListener("click", () => setSeries(b.dataset.series));
    loadCompanies().catch((error) => (el("error").textContent = "載入失敗：" + error.message));
  </script>
</html>
